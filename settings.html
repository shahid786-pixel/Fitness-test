<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Fitness Pro</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            color: #ff7700;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff7700;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }
        .setting-item:last-child {
            border-bottom: none;
        }
        .setting-title {
            font-size: 16px;
            color: #ffffff;
        }
        .setting-desc {
            font-size: 12px;
            color: #888888;
        }
        /* Switch Toggle Style */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #ff7700;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #ff7700;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>App Settings</h1>
        <p>Customize your fitness experience</p>
    </header>

    <div class="container">
        <!-- Dark Mode Setting -->
        <div class="setting-item">
            <div>
                <div class="setting-title">Dark Theme</div>
                <div class="setting-desc">Always use dark mode interface</div>
            </div>
            <label class="switch">
                <input type="checkbox" checked disabled>
                <span class="slider"></span>
            </label>
        </div>

        <!-- Notifications Setting -->
        <div class="setting-item">
            <div>
                <div class="setting-title">Workout Reminders</div>
                <div class="setting-desc">Get daily motivation alerts</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="notifToggle" checked onclick="alert('Preference updated!')">
                <span class="slider"></span>
            </label>
        </div>

        <!-- App Info -->
        <div class="setting-item">
            <div>
                <div class="setting-title">App Version</div>
                <div class="setting-desc">Fitness Pro v1.0.0</div>
            </div>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

</body>
  </html>
