<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abs Workout - Fitness Pro</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            color: #ff7700;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff7700;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ff7700;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #2e2e2e;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }
        .btn {
            background-color: #ff7700;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn:hover {
            background-color: #e06600;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #ff7700;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Abs & Core Workout Task</h1>
        <p>Core strengthening and six-pack shredding routines</p>
    </header>

    <div class="container">
        <!-- YouTube Video Embedded -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/e1mOv4BkdrQ" frameborder="0" allowfullscreen></iframe>
        </div>

        <!-- Task Submission Form -->
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Your Name:</label>
                <input type="text" id="username" name="username" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="proof">Upload Photo/Video Proof:</label>
                <input type="file" id="proof" name="proof" accept="image/*,video/*" required>
            </div>

            <button type="submit" class="btn">Submit Task</button>
        </form>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

</body>
</html>
